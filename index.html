
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Portal</h1>
        <p>AWS CI/CD Deployment Demo</p>
    </header>

    <main class="container">
        <h2>Welcome, Student!</h2>
        <p class="subtitle">Your student information dashboard</p>

        <div class="cards">
            <div class="card">
                <h3>Student Name</h3>
                <p>Gaurav Singh</p>
            </div>

            <div class="card">
                <h3>Course</h3>
                <p>B.Tech Computer Science</p>
            </div>

            <div class="card">
                <h3>University</h3>
                <p>UPES</p>
            </div>

            <div class="card">
                <h3>Deployment Status</h3>
                <p class="success">Application Running</p>
            </div>
        </div>

        <p class="footer">
            Deployed automatically using AWS CodePipeline,
            CodeBuild and CodeDeploy.
        </p>
    </main>

</body>
</html>
